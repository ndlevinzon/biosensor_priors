# Fitness definition — preregistered before any modeling or search.
# Changing weights after seeing results is not allowed for a given analysis round.

formulation: weighted_scalar

# F = 0.40*S + 0.25*A + 0.20*FC + 0.15*B on percentile-normalized components.
# Missing components are not imputed; weights are redistributed over available
# phenotypes (see observations.missing_phenotype).
weights:
  selectivity: 0.40
  affinity: 0.25
  fc: 0.20
  brightness: 0.15

min_components: 2

# Observation handling policies (must match fitness implementation).
observations:
  affinity:
    exact: use_as_is                    # -log10(Kd_uM); higher is better
    left_censored: use_bound_conservative  # <x → use x (conservative)
    right_censored: omit                # >x would be optimistic for tighter binding
  fc:
    exact: use_as_is                    # log10(FC); higher is better
    right_censored: use_bound_conservative  # >x → use x
    left_censored: omit
  selectivity:
    # Use positive lower bound of Kd(Prop)/Kd(Ac) interval (conservative).
    exact: use_lower_bound
    interval: use_lower_bound
    left_censored: omit                 # lower bound 0 is uninformative
  brightness:
    qualitative: map_to_ordinal_then_normalize
  missing_phenotype: redistribute_weights

# Design constraints used by Stage 0 validation and Stage 4 design space
design:
  allowed_mutable_positions: []
  allowed_amino_acids:
    - A
    - C
    - D
    - E
    - F
    - G
    - H
    - I
    - K
    - L
    - M
    - N
    - P
    - Q
    - R
    - S
    - T
    - V
    - W
    - Y
  maximum_mutations_per_construct: 3

# Control mutations that must appear in the experimental database
required_control_mutations:
  - Q324R
  - A355R
