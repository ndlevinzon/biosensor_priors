# Search / active-learning configuration (Stage 4)
# Defaults aligned with BO-EVO SI / project reference benchmark.

batch_size: 8
candidate_m: 256

# Enumerative BO UCB: mu + kappa * sigma
ucb:
  kappa: 1.5

# AdaLead - paper parent rule: F >= (1-kappa)*F_max
adalead:
  parent_mode: relative_kappa
  kappa: 0.05
  # absolute_epsilon mode alternative (project legacy):
  # parent_mode: absolute_epsilon
  # epsilon: 0.05

# MCMC - maximization form pi proportional to exp(mu/T)
mcmc:
  temperature: 0.10
  n_steps: 300
  n_chains: 8

# Optional sigma_eff + conformal calibration (Stage 3 writes lambda and q)
uncertainty:
  use_effective: true
  lambda_structure: 1.0
  lambda_physics: 1.0

# Thompson sampling (primary phenotype + optional constraints)
# Constraints apply to Thompson and to Stage-4 exploit proposals.
# Brightness min 0.55 sits above the similar (ordinal 0) cluster so
# proposals must be brighter than Pan1.0-like, not merely not-dim.
# fc_prop min 0.50 uses the off-target head rather than 7 Kd-ratio labels.
thompson:
  primary: fitness
  min_feasibility: 0.0
  constraints:
    brightness:
      min: 0.55
      min_prob: 0.50
    fc_prop:
      min: 0.50
      min_prob: 0.50

# Primary Stage-4 artifacts: constructs to improve F, and constructs to
# reduce design-space uncertainty. Cost filter applies to exploit only.
proposals:
  exploit_size: 8
  explore_size: 8

prefilter:
  hard_fail_exclude: true
  soft_fail_to_exploration: true
  exploration_budget_fraction: 0.15

# Optional post-hoc diversification (disabled for paper-faithful top-B)
batch_diversification:
  enabled: false
  max_candidates_per_position: 2
  min_sequence_distance: 1
  exploitation_fraction: 0.7

# Multi-round retrospective campaign (BO-EVO evaluation protocol)
campaign:
  n_repeats: 5
  n_rounds: 5
  initial_n: 8
  encoding: hybrid   # onehot | georgiev | hybrid | mutation_bag
  top_quantile: 0.05

strategies:
  - random
  - adalead
  - mcmc
  - bo
  - thompson
