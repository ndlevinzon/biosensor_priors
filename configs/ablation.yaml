# Stage 6 ablation matrix
# Every row shares Stage-0 splits and pipeline.random_seed.

random_seed: null  # null → use pipeline.random_seed
n_bootstrap: 1000
alpha: 0.05
encoding: null  # null → use thresholds.gp.encoding
reference_config_id: physics_gp_conf_consensus

# Structure confidence tables (optional; missing → unit confidence with flag).
structure_confidence_dir: "data/processed"
structure_confidence_pattern: "structural_confidence_{source}.parquet"

configs:
  - id: physics_only_consensus
    label: "Physics only"
    physics: true
    gp: false
    confidence_weighting: null
    structure_source: consensus
    prefilter: false

  - id: gp_only
    label: "GP only"
    physics: false
    gp: true
    confidence_weighting: null
    structure_source: null
    prefilter: false

  - id: physics_gp_no_conf
    label: "Physics+GP (no conf weighting)"
    physics: true
    gp: true
    confidence_weighting: false
    structure_source: consensus
    prefilter: false

  - id: physics_gp_conf_consensus
    label: "Physics+GP + conf (consensus)"
    physics: true
    gp: true
    confidence_weighting: true
    structure_source: consensus
    prefilter: false

  - id: physics_gp_conf_af2_prefilter
    label: "Physics+GP + conf (Boltz2) + prefilter"
    physics: true
    gp: true
    confidence_weighting: true
    structure_source: Boltz2
    prefilter: true

  - id: physics_gp_conf_af3_prefilter
    label: "Physics+GP + conf (AF3) + prefilter"
    physics: true
    gp: true
    confidence_weighting: true
    structure_source: AF3
    prefilter: true
