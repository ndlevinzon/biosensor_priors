# Structure / confidence thresholds (Stage 1)
structure:
  predictors:
    - Boltz2
    - AF3
    - ESMFold
    - RF3
  seeds: [1, 2, 3]
  states:
    - apo
    - AcCoA
    - PropCoA
  confidence:
    plDDT_min_reliable: 70.0
    rmsd_max_reliable: 2.0
    pae_pocket_max_reliable: 10.0
    confidence_min_reliable: 0.5

# Physics landscape thresholds (Stage 2)
physics:
  # Freeze score direction before coding. Downstream must not guess.
  # Convention: more negative = better. RF3 docking maps −confidence into
  # rif_ac / rif_prop so this direction stays valid.
  score_direction: more_negative_is_better
  rif:
    accoa_threshold: null  # set from calibration
    propcoa_threshold: null
  controls:
    - mutation: Q324R
      expected_direction: favorable_AcCoA
    - mutation: A355R
      expected_direction: favorable_AcCoA

# GP / surrogate (Stage 3)
gp:
  kernel: matern52
  encoding: hybrid   # onehot | georgiev | hybrid | mutation_bag
  physics_mean_weights:
    w_rif_ac: null
    w_rif_prop: null
    w_delta_rif_sel: null
  leave_one_construct_out: true
