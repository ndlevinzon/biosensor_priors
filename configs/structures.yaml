# Stage 1 structure prediction — CHPC (University of Utah) SLURM defaults.
# Granite allocation: account=cheatham; CPU=granite, GPU=granite-gpu (+ matching qos).

provider: chpc_utah

predictors:
  - Boltz2
  - AF3
  - ESMFold
  - RF3

seeds: [1, 2, 3]
states:
  - apo
  # Ligand-bound AF3 / Boltz YAML jobs require CCD / SMILES entries (optional later).
  # - AcCoA
  # - PropCoA

default_version: null

# Boltz-2 (CHPC: module load boltz2). Replaces AlphaFold2 for Stage 1.
# Docs: https://www.chpc.utah.edu/documentation/software/alphafold.php#boltz
boltz2:
  module: "boltz2/2.2.1"
  run: "boltz"
  # CHPC example uses FASTA; yaml also supported (input_format: yaml)
  input_format: fasta
  use_msa_server: true
  # On-campus ColabFold MSA (try colabfold01 if 02 returns MMseqs2 ERROR)
  msa_server_url: "http://colabfold02.int.chpc.utah.edu:8088"
  # One MSA per sequence/state; later seeds depend on the first (do not hammer MSA)
  share_msa_across_seeds: true
  diffusion_samples: 1
  recycling_steps: null
  output_format: mmcif
  override: true
  job:
    partition: granite-gpu
    qos: granite-gpu
    account: cheatham
    # Lightning: ntasks-per-node=1; CPUs for MSA client (CHPC examples use ~16)
    ntasks_per_node: 1
    cpus_per_task: 16
    nodes: 1
    mem: 64G
    time: "8:00:00"
    gres: "gpu:1"

af3:
  module: "alphafold/3.0.0"
  # Requires CHPC AF3 weight access (email helpdesk@chpc.utah.edu).
  run: "run_alphafold.sh"
  scratch_db: "/scratch/general/vast/app-repo/alphafold3"
  dialect: alphafold3
  version: 1
  flash_attention_implementation: null
  step1:
    partition: granite
    qos: granite
    account: cheatham
    ntasks: 16
    nodes: 1
    mem: 64G
    time: "8:00:00"
    gres: null
  step2:
    partition: granite-gpu
    qos: granite-gpu
    account: cheatham
    ntasks_per_node: 1
    cpus_per_task: 4
    nodes: 1
    mem: 32G
    time: "24:00:00"
    gres: "gpu:1"

esmfold:
  module: "esmfold/1.0.3"
  python: python
  device: cuda
  num_recycles: 4
  chunk_size: 128
  job:
    partition: granite-gpu
    qos: granite-gpu
    account: cheatham
    ntasks_per_node: 1
    cpus_per_task: 4
    nodes: 1
    mem: 32G
    time: "4:00:00"
    gres: "gpu:1"

# RoseTTAFold3 via RosettaCommons Foundry (`rf3 fold`). Replaces RoseTTAFold2.
# CHPC does not currently ship an RF3 module — install in your env:
#   pip install 'rc-foundry[rf3]'
#   foundry install base-models   # or set ckpt_path below
# Docs: https://github.com/RosettaCommons/foundry/blob/production/models/rf3/README.md
rosettafold3:
  module: null
  # Optional: path to conda activate script that has `rf3` on PATH
  # conda_activate: "/uufs/.../.conda/envs/rf3/bin/activate"
  conda_activate: null
  run: "rf3"
  # In-repo Foundry checkpoint (gitignored; not touched by clean_pipeline_artifacts).
  # Install: mkdir -p weights/rf3 && foundry install base-models --checkpoint-dir "$PWD/weights/rf3"
  ckpt_path: "weights/rf3/rf3_foundry_01_24_latest_remapped.ckpt"
  # Disable early-stop so apo runs always write a model CIF
  early_stopping_plddt_threshold: 0.0
  job:
    partition: granite-gpu
    qos: granite-gpu
    account: cheatham
    # Foundry/Lightning: use ntasks_per_node (not bare #SBATCH -n / --ntasks)
    ntasks_per_node: 1
    nodes: 1
    mem: 64G
    time: "12:00:00"
    gres: "gpu:1"

jobs:
  jobs_subdir: jobs
  logs_subdir: logs
  submit: false
  chain_gpu_after_msa: true

confidence:
  plDDT_min_reliable: 70.0
  rmsd_max_reliable: 2.0
  pae_pocket_max_reliable: 10.0
  confidence_min_reliable: 0.5
  w_plddt: 0.5
  w_rmsd: 0.3
  w_pae: 0.2
