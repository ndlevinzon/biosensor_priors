# Stage 2 physics landscape — external tool paths and job settings.
# Score *direction* lives in thresholds.yaml (frozen; do not re-derive here).
#
# External binaries are optional until HPC deployment. Use backend: mock for
# local dry-runs that exercise the full Python orchestration + Gate 2 path.
#
# CHPC notes:
# - No OpenEye OMEGA → built-in RDKit ETKDG conformer generator (builtin:rdkit).
# - QM via Gaussian16: module load gaussian16/SSE4.C01 (ember/lonepeak SSE4).

backend: mock  # mock | external

ligands:
  names:
    - AcCoA
    - PropCoA
  # Starting structures (SDF/MOL2/PDB). Missing → SMILES below → placeholders (mock).
  starting_structures:
    AcCoA: null
    PropCoA: null
  # Used when starting_structures are null and RDKit is available.
  smiles:
    # Ionized CoA phosphates (−4); adjust charge under qm if you change protonation.
    AcCoA: "CC(=O)SCCNC(=O)CCNC(=O)[C@H](O)C(C)(C)COP(=O)([O-])OP(=O)([O-])OC[C@H]1O[C@@H](n2cnc3c(N)ncnc32)[C@H](O)[C@@H]1OP(=O)([O-])[O-]"
    PropCoA: "CCC(=O)SCCNC(=O)CCNC(=O)[C@H](O)C(C)(C)COP(=O)([O-])OP(=O)([O-])OC[C@H]1O[C@@H](n2cnc3c(N)ncnc32)[C@H](O)[C@@H]1OP(=O)([O-])[O-]"
  pipeline:
    - conformer_generation
    - geometry_cleanup
    - qm_refinement
    - deduplication_clustering
    - approve_ensemble
  # builtin:* uses in-repo tools; set absolute paths to override with wrappers.
  tools:
    conformer_generator: "builtin:rdkit"      # OMEGA replacement
    geometry_cleanup: "builtin:rdkit_mmff"  # MMFF minimize (same RDKit stack)
    qm_refinement: "builtin:gaussian16"     # write GJF + SLURM (run on CHPC)
    clustering: "builtin:rdkit_rmsd"
  conformer_generation:
    method: etkdg
    n_conformers: 50
    prune_rms_thresh: 0.5
    random_seed: 42
    force_field: MMFF94
    minimize: true
    max_iters: 200
  geometry_cleanup:
    force_field: MMFF94
    max_iters: 200
  qm:
    module: "gaussian16/SSE4.C01"
    executable: g16
    # CoA-like ligands with 3× phosphate (−4) in SMILES above
    charge: -4
    multiplicity: 1
    route: "#p B3LYP/6-31G(d) Opt"
    nproc: 8
    mem: "32GB"
    # Always write .gjf/.slurm under ligands/*/qm/ (even under mock)
    write_scripts: true
    job:
      partition: notchpeak
      account: null   # set to your CHPC account
      nodes: 1
      ntasks: 8
      mem: 32G
      time: "24:00:00"
  clustering:
    rmsd_threshold_angstrom: 0.5
    max_conformers_per_ligand: 32
  # Bump only when the *definition* of conformer_id content changes.
  conformer_id_schema_version: 1

# Interface + packing priors via CHPC PyRosetta (configs/rosetta_physics.yaml).
# Schema columns keep legacy names: rif_ac / rif_prop / rpx / delta_rif_sel.
# Keep backend: mock until Gate 2 passes on real pyrosetta scores.
rif:
  executable: "python -m biosensor_priors.stage2_physics.wrappers.run_rosetta"
  command_template: >-
    {executable}
    --structure {structure_pdb}
    --ligands {ligand_dir}
    --ligand-name {ligand_name}
    --out {out_dir}
    --structure-model-id {structure_model_id}
    --scaffold
  output_score_filename: rif_scores.tsv
  ligands:
    - AcCoA
    - PropCoA

rpx:
  # Same PyRosetta mutate+pack total energy → rpx column.
  executable: "python -m biosensor_priors.stage2_physics.wrappers.run_rpx"
  command_template: >-
    {executable}
    --structure {structure_pdb}
    --mutation {mutation}
    --out {out_dir}
    --structure-model-id {structure_model_id}
    --scaffold
  output_score_filename: rpx_scores.tsv

# CHPC PyRosetta next steps:
# 1. module load pyrosetta/4.0.0
# 2. Set configs/rosetta_physics.yaml complexes.AcCoA / PropCoA to holo PDBs
# 3. Drop --scaffold from command_templates above; set backend: external
# 4. jobs.module_loads: [pyrosetta/4.0.0]; Gate 2 on Q324R / A355R

scan:
  # Canonical positions / AAs come from fitness.yaml design block by default.
  positions: null
  amino_acids: null
  # Include wild-type identity mutants in the long table.
  include_wt: true

jobs:
  # local: write scripts + optionally run subprocess
  # slurm: write sbatch scripts (do not submit unless submit: true)
  scheduler: local
  submit: false
  walltime: "04:00:00"
  partition: null
  account: null
  cpus: 4
  mem_gb: 16
  # Enable when backend: external on CHPC
  module_loads: []   # e.g. [pyrosetta/4.0.0]
  # Relative to data/physics
  jobs_subdir: jobs
  logs_subdir: logs

uncertainty:
  # Join structural_confidence when available
  structural_confidence_path: "data/processed/structural_confidence.parquet"
  min_n_structures: 1

# Mock backend (deterministic pseudo-physics for orchestration tests)
mock:
  # Favorable AcCoA controls get more-negative rif_ac than rif_prop when
  # thresholds.physics.score_direction is more_negative_is_better.
  control_delta_rif_sel:
    Q324R: -2.5
    A355R: -2.0
  base_rif_prop: -8.0
  base_rpx: -5.0
  structure_noise_sd: 0.4
