[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biosensor-priors"
version = "0.1.0"
description = "Physics-informed Gaussian process pipeline for biosensor design and active learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ndlev" },
]
keywords = [
    "biosensor",
    "priors",
    "gaussian-process",
    "active-learning",
    "RIF",
    "RPX",
    "bayesian-optimization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "openpyxl>=3.1",
    "biopython>=1.83",
    "scikit-learn>=1.4",
]

[project.scripts]
biosensor-stage0 = "biosensor_priors.stage0_ground_truth.load_experiments:main"
biosensor-stage1 = "biosensor_priors.stage1_structures.run:main"
biosensor-stage3 = "biosensor_priors.stage3_surrogate.run:main"
biosensor-stage4 = "biosensor_priors.stage4_search.run:main"
biosensor-stage4-campaign = "biosensor_priors.stage4_search.campaign:main"
biosensor-stage5 = "biosensor_priors.stage5_prospective.run:main"
biosensor-stage6 = "biosensor_priors.stage6_ablation.run:main"
biosensor-stage2 = "biosensor_priors.stage2_physics.run:main"
biosensor-ligand-conformers = "biosensor_priors.stage2_physics.conformer_generator:main"
biosensor-gaussian-qm = "biosensor_priors.stage2_physics.gaussian_qm:main"
biosensor-rif = "biosensor_priors.stage2_physics.wrappers.run_rif:main"
biosensor-rpx = "biosensor_priors.stage2_physics.wrappers.run_rpx:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "matplotlib>=3.8",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "myst-parser>=4.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-copybutton>=0.5",
]
ml = [
    "scikit-learn>=1.4",
    "gpytorch>=1.11",
    "torch>=2.2",
]
chem = [
    "rdkit>=2023.9.1",
]
all = [
    "biosensor-priors[dev,docs,ml,chem]",
]

[project.urls]
Documentation = "https://biosensor-priors.readthedocs.io"
Repository = "https://github.com/ndlev/biosensor-priors"
Changelog = "https://github.com/ndlev/biosensor-priors/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/biosensor_priors"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
